<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>客户沟通纪要 · E2C</title>
<meta name="theme-color" content="#FF3B30">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F5F7;
    --card: #FFFFFF;
    --card-2: #F5F5F7;
    --text: #1D1D1F;
    --text-2: #6E6E73;
    --line: #E5E5EA;
    --accent: #FF3B30;
    --accent-soft: #FFEFED;
    --blue: #0071E3;
    --radius: 14px;
  }
  html, body { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro SC", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: var(--text);
    max-width: 600px;
    margin: 0 auto;
    padding: 0 16px calc(28px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  /* 顶部导航 */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 2px 10px;
    background: var(--bg);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .topbar .back-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--card); color: var(--accent);
    border: none; border-radius: 999px;
    padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  .topbar .count { font-size: 12px; color: var(--text-2); font-weight: 400; }

  /* 搜索 */
  .search-wrap { padding: 2px 0 12px; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border-radius: 12px;
    border: 1.5px solid var(--line);
    padding: 10px 14px;
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box span { font-size: 14px; opacity:.6; }
  .search-box input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--text);
  }
  .search-box .clear { border: none; background: none; font-size: 16px; color: var(--text-2); cursor: pointer; display: none; }

  /* 记录卡片 */
  .rec-card {
    background: var(--card); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    cursor: pointer; transition: transform .12s ease;
  }
  .rec-card:active { transform: scale(.985); }
  .rec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rec-date { font-size: 14px; font-weight: 700; }
  .rec-remove {
    border: none; background: none; color: var(--text-2);
    font-size: 12px; padding: 6px; cursor: pointer; border-radius: 8px;
  }
  .rec-remove:hover { color: var(--accent); background: var(--accent-soft); }
  .rec-meta { display: flex; gap: 10px; font-size: 11.5px; color: var(--text-2); margin-top: 4px; flex-wrap: wrap; }
  .rec-note {
    margin-top: 8px; font-size: 12.5px; color: var(--text);
    background: var(--card-2); border-radius: 10px; padding: 8px 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    white-space: pre-wrap;
  }
  .rec-note:empty { display: none; }
  .rec-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .rec-tags .tag {
    font-size: 10.5px; padding: 3px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .rec-tags .tag.gray { background: var(--card-2); color: var(--text-2); }
  .rec-more { margin-top: 8px; font-size: 11.5px; color: var(--blue); font-weight: 600; }

  /* 详情面板 */
  .detail-panel { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .dp-block { margin-bottom: 12px; }
  .dp-title { font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; letter-spacing: .2px; }
  .dp-body { font-size: 12.5px; line-height: 1.7; color: var(--text); }
  .dp-seg { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .dp-seg:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .dp-seg .meta { font-size: 10px; color: var(--text-2); margin-bottom: 2px; }
  .dp-seg .dir { color: var(--blue); font-weight: 600; }
  .dp-seg .dst { color: var(--text-2); }
  .dp-prod {
    display: flex; align-items: baseline; gap: 8px;
    background: var(--card-2); border-radius: 10px; padding: 7px 10px; margin-bottom: 5px;
  }
  .dp-prod .m { font-weight: 700; font-size: 12.5px; color: var(--accent); white-space: nowrap; }
  .dp-prod .d { font-size: 11.5px; color: var(--text-2); }
  .dp-note { white-space: pre-wrap; background: var(--accent-soft); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; color: var(--text); }
  .dp-actions { display: flex; gap: 8px; margin-top: 4px; }
  .dp-actions button {
    flex: 1; border: none; border-radius: 999px; padding: 9px 0;
    font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .dp-actions button.ghost { background: var(--card-2); color: var(--text); }

  .empty {
    text-align: center; padding: 70px 20px; color: var(--text-2);
  }
  .empty .big { font-size: 46px; margin-bottom: 14px; }
  .empty p { font-size: 14px; line-height: 1.8; }
  .empty .btn-ghost {
    display: inline-block; margin-top: 18px; padding: 10px 22px;
    border-radius: 999px; background: var(--card); color: var(--accent);
    font-size: 14px; font-weight: 600; text-decoration: none;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">‹ 实时翻译</button>
  <h1>客户沟通纪要</h1>
  <div class="count" id="count">0 条</div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <span>🔍</span>
    <input id="searchInput" type="text" placeholder="搜索关键词 / 产品型号 / 客户备注…" autocomplete="off">
    <button class="clear" id="searchClear" onclick="clearSearch()">✕</button>
  </div>
</div>

<div id="list"></div>

<script>
  var STORE_KEY = "e2c_records";

  function getRecords() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); }
    catch (e) { return []; }
  }

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }); }
    catch (e) { return iso; }
  }

  function durationOf(startISO, endISO) {
    try {
      var s = new Date(startISO).getTime(), e = new Date(endISO).getTime();
      var m = Math.max(1, Math.round((e - s) / 60000));
      return m + " 分钟";
    } catch (e) { return "-"; }
  }

  function esc(t) {
    return String(t == null ? "" : t)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function productLabel(p) {
    var sp = (p.sellingPoints || []).slice(0, 2).join(" · ");
    return (p.name || "") + (sp ? " · " + sp : "");
  }

  function render() {
    var q = document.getElementById("searchInput").value.trim().toLowerCase();
    var all = getRecords();
    document.getElementById("count").textContent = all.length + " 条";

    if (!all.length) {
      document.getElementById("list").innerHTML =
        '<div class="empty"><div class="big">📝</div>' +
        '<p>还没有客户纪要<br>在实时翻译页完成一次对话后<br>点击「生成客户沟通纪要」并保存即可</p>' +
        '<a class="btn-ghost" href="index.html">去开始翻译 ›</a></div>';
      return;
    }

    var html = "";
    var shown = 0;
    for (var i = 0; i < all.length; i++) {
      var r = all[i];
      var segText = (r.segments || []).map(function (s) { return s.src + " " + (s.dst || ""); }).join(" ");
      var hay = (r.note || "") + " " + segText + " " + (r.signals || []).join(" ") + " " + (r.products || []).map(function (p) { return p.model + " " + p.name; }).join(" ");
      if (q && hay.toLowerCase().indexOf(q) === -1) continue;
      shown++;

      var segs = r.segments || [];
      var tagHTML = "";
      (r.signals || []).slice(0, 4).forEach(function (sg) { tagHTML += '<span class="tag">' + esc(sg) + '</span>'; });
      (r.products || []).slice(0, 3).forEach(function (p) { tagHTML += '<span class="tag gray">' + esc(p.model) + '</span>'; });

      var detail = '<div class="detail-panel">';
      var endISO = r.endTime || r.startTime;
      detail += '<div class="dp-block"><div class="dp-title">⏱ 会话信息</div><div class="dp-body">' +
        fmtDate(r.startTime) + ' ~ ' + fmtDate(endISO) + ' · 时长 ' + durationOf(r.startTime, endISO) + ' · ' + segs.length + ' 句对话</div></div>';

      if (r.signals && r.signals.length) {
        detail += '<div class="dp-block"><div class="dp-title">客户信号</div><div class="dp-body">';
        detail += (r.signals || []).map(function (s) { return '<span class="tag">' + esc(s) + '</span>'; }).join(" ");
        detail += '</div></div>';
      }
      if (r.products && r.products.length) {
        detail += '<div class="dp-block"><div class="dp-title">匹配产品</div><div class="dp-body">';
        detail += (r.products || []).map(function (p) {
          return '<div class="dp-prod"><span class="m">' + esc(p.model) + '</span><span class="d">' + esc(productLabel(p)) + '</span></div>';
        }).join("");
        detail += '</div></div>';
      }
      if (r.note) {
        detail += '<div class="dp-block"><div class="dp-title">客户档案备注</div><div class="dp-note">' + esc(r.note) + '</div></div>';
      }
      if (segs.length) {
        detail += '<div class="dp-block"><div class="dp-title">完整对话</div><div class="dp-body">';
        detail += segs.map(function (s) {
          return '<div class="dp-seg"><div class="meta">' + esc(s.time || "") + ' · <span class="dir">' + (s.dir === "z2e" ? "中→英" : "英→中") + '</span></div>' +
            esc(s.src) + (s.dst ? '<br><span class="dst">→ ' + esc(s.dst) + '</span>' : '') + '</div>';
        }).join("");
        detail += '</div></div>';
      }
      detail += '<div class="dp-actions">' +
        '<button class="ghost" onclick="copyOne(event, ' + r.id + ')">📋 复制文本</button>' +
        '<button onclick="removeOne(event, ' + r.id + ')">🗑 删除</button>' +
        '</div></div>';

      html += '<div class="rec-card">' +
        '<div class="rec-head"><div class="rec-date">' + fmtDate(r.startTime) + '</div>' +
        '<button class="rec-remove" onclick="removeOne(event, ' + r.id + ')">✕</button></div>' +
        '<div class="rec-meta"><span>⏱ ' + durationOf(r.startTime, r.endTime || r.startTime) + '</span>' +
        '<span>💬 ' + segs.length + ' 句</span>' +
        '<span>🏷 ' + (r.signals || []).length + ' 信号</span>' +
        '<span>📦 ' + (r.products || []).length + ' 产品</span></div>' +
        (r.note ? '<div class="rec-note">' + esc(r.note) + '</div>' : '') +
        (tagHTML ? '<div class="rec-tags">' + tagHTML + '</div>' : '') +
        '<div class="rec-more">点开查看详情 ›</div>' +
        detail + '</div>';
    }

    if (!shown) {
      html = '<div class="empty"><div class="big">🔍</div><p>没有匹配的记录<br>换个关键词试试</p></div>';
    }
    document.getElementById("list").innerHTML = html;
  }

  function copyOne(ev, id) {
    ev.stopPropagation();
    var r = getRecords().filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    var text = "📋 客户沟通纪要\n━━━━━━━━━━━━━━\n";
    text += "时间：" + fmtDate(r.startTime) + "\n";
    text += "轮次：" + (r.segments || []).length + " 句\n\n";
    if ((r.signals || []).length) text += "【客户信号】\n" + r.signals.join(", ") + "\n\n";
    if ((r.products || []).length) {
      text += "【匹配产品】\n";
      (r.products || []).forEach(function (p) { text += "- " + p.model + "：" + p.name + "\n"; });
      text += "\n";
    }
    text += "【对话摘要】\n";
    (r.segments || []).forEach(function (s) {
      text += "[" + s.time + "] " + s.src + "\n";
      if (s.dst) text += "  → " + s.dst + "\n";
    });
    if (r.note) text += "\n【备注】\n" + r.note;
    copyText(text);
  }

  function copyText(text) {
    function done() { alert("📋 已复制到剪贴板"); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done0(); } catch (e) { alert("复制失败，请手动复制"); }
    document.body.removeChild(ta);
    function done0() { alert("📋 已复制到剪贴板"); }
  }

  function removeOne(ev, id) {
    ev.stopPropagation();
    if (!confirm("确定删除这条纪要吗？此操作不可恢复。")) return;
    var records = getRecords().filter(function (x) { return x.id !== id; });
    localStorage.setItem(STORE_KEY, JSON.stringify(records));
    render();
  }

  function clearSearch() {
    document.getElementById("searchInput").value = "";
    document.getElementById("searchClear").style.display = "none";
    render();
  }

  // 卡片点击展开/收起
  document.addEventListener("click", function (ev) {
    var card = ev.target.closest ? ev.target.closest(".rec-card") : null;
    if (!card) return;
    if (ev.target.closest("button")) return; // 复制/删除按钮不触发展开
    var panel = card.querySelector(".detail-panel");
    if (!panel) return;
    var wasOpen = panel.style.display === "block";
    document.querySelectorAll(".rec-card .detail-panel").forEach(function (p) { p.style.display = "none"; });
    if (!wasOpen) panel.style.display = "block"; // 已展开则收起
  });

  document.getElementById("searchInput").addEventListener("input", function () {
    document.getElementById("searchClear").style.display = this.value ? "block" : "none";
    render();
  });

  render();
</script>
</body>
</html>
