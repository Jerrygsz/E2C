<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>实时听译 · 中英对话翻译</title>
<meta name="description" content="用手机麦克风实时听取对话，自动识别并中英互译，境内网络可用。">
<meta name="theme-color" content="#F5F5F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="实时听译">
<link rel="icon" type="image/png" id="siteIcon">
<style>
  :root {
    --bg: #F5F5F7;
    --card: #FFFFFF;
    --card-2: #F2F2F7;
    --line: rgba(0,0,0,.06);
    --text: #1D1D1F;
    --text-2: #3C3C43;
    --text-dim: #8E8E93;
    --accent: #FF3B30;
    --accent-2: #FF6B61;
    --accent-dark: #D62921;
    --good: #34C759;
    --bad: #FF3B30;
    --warn: #FF9500;
    --blue: #007AFF;
    --radius: 18px;
    --radius-lg: 22px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    overflow-x: hidden;
  }
  .app { max-width: 600px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(var(--safe-b) + 28px); }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent);
    font-size: 20px; font-weight: 700; color: #fff; box-shadow: 0 2px 12px rgba(255,59,48,.25);
  }
  .brand h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.3px; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--text-dim); font-weight: 500; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); color: var(--text-2); font-size: 18px; cursor: pointer;
    display: grid; place-items: center; transition: background .2s;
  }
  .icon-btn:active { background: var(--card-2); }

  /* ---------- status bar ---------- */
  .status-bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line);
    font-size: 13px; color: var(--text-dim); margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex: none; transition: background .25s; }
  .dot.on { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .dot.err { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  #statusText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- direction chooser ---------- */
  .dir-switch { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-bottom: 20px; }
  .dir-card {
    border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--card);
    padding: 14px 10px; text-align: center; cursor: pointer; transition: all .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .dir-card .lg { font-size: 14px; font-weight: 700; }
  .dir-card .sub { font-size: 11px; color: var(--text-dim); margin-top: 3px; font-weight: 500; }
  .dir-card.sel { border-color: var(--accent); background: rgba(255,59,48,.06); }
  .dir-card.sel .lg { color: var(--accent); }
  .dir-arrow { display: grid; place-items: center; font-size: 16px; color: var(--text-dim); }

  /* ---------- main mic button ---------- */
  .mic-zone { display: flex; flex-direction: column; align-items: center; padding: 20px 0 8px; }
  .mic-btn {
    position: relative; width: 120px; height: 120px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent);
    box-shadow: 0 6px 24px rgba(255,59,48,.35), inset 0 -2px 0 rgba(0,0,0,.08);
    display: grid; place-items: center; transition: transform .15s, background .25s;
  }
  .mic-btn:active { transform: scale(.96); }
  .mic-btn svg { width: 48px; height: 48px; fill: #fff; transition: fill .25s; }
  .mic-btn.active { background: var(--accent-dark); }
  .mic-btn.active::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 2.5px solid rgba(255,59,48,.3); animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse { 0% { transform: scale(.98); opacity: 1; } 70% { transform: scale(1.25); opacity: 0; } 100% { opacity: 0; } }
  .mic-label { margin-top: 14px; font-size: 16px; font-weight: 700; }
  .mic-sub { margin-top: 4px; font-size: 12.5px; color: var(--text-dim); text-align: center; font-weight: 500; }

  /* ---------- live zone ---------- */
  .live-zone { margin-top: 16px; display: none; }
  .live-zone.show { display: block; }
  .live-box {
    border-radius: var(--radius); background: var(--card); border: 1px solid var(--line);
    padding: 14px 16px; margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .4px; margin-bottom: 6px; }
  .tag .b { color: var(--blue); }
  #interimText { font-size: 16px; min-height: 26px; color: var(--text); }
  #interimText.placeholder { color: var(--text-dim); font-size: 14px; }
  #transResult { font-size: 15.5px; min-height: 26px; color: var(--text-2); }
  #transResult.loading { color: var(--warn); }

  /* ---------- text fallback ---------- */
  .text-zone { margin-top: 12px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .text-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .text-tip { font-weight: 400; font-size: 11.5px; color: var(--text-dim); margin-left: 6px; }
  .text-row { display: flex; gap: 10px; margin-top: 10px; }
  .text-row input {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--card-2); color: var(--text); font-size: 15px; outline: none;
    transition: border-color .2s;
  }
  .text-row input:focus { border-color: var(--accent); }
  .text-row button {
    flex: none; padding: 0 18px; border: none; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
    transition: background .2s;
  }
  .text-row button:active { background: var(--accent-dark); }
  .text-done { font-size: 13px; color: var(--text-2); margin-top: 8px; word-break: break-all; display: none; }
  .text-done.show { display: block; }

  /* ---------- session ---------- */
  .session-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 12px; }
  .session-head h2 { font-size: 15px; margin: 0; color: var(--text-dim); font-weight: 700; letter-spacing: .3px; }
  .session-head button {
    background: none; border: none; color: var(--text-dim); font-size: 12.5px; cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  .session-head button:active { background: rgba(0,0,0,.04); }
  #sessionList { display: flex; flex-direction: column; gap: 10px; }
  .seg {
    border-radius: var(--radius); background: var(--card); border: 1px solid var(--line);
    padding: 12px 14px; animation: rise .25s ease;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .seg .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .seg .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .badge.zh { background: rgba(0,122,255,.12); color: var(--blue); }
  .badge.en { background: rgba(255,59,48,.12); color: var(--accent); }
  .seg .time { font-size: 10.5px; color: var(--text-dim); flex: 1; }
  .seg .copy { font-size: 11.5px; color: var(--text-dim); background: none; border: none; cursor: pointer; padding: 2px 6px; }
  .seg .src { font-size: 15.5px; color: var(--text); }
  .seg .dst { font-size: 15.5px; color: var(--text-2); margin-top: 3px; }
  .seg .dst.failed { color: var(--bad); font-size: 13px; }
  .empty { text-align: center; color: var(--text-dim); font-size: 13.5px; padding: 36px 0; }
  .empty .big { font-size: 32px; margin-bottom: 8px; }

  /* ---------- sheet / settings ---------- */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40; }
  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--card); border-radius: 24px 24px 0 0; border-top: 1px solid var(--line);
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.25,1);
    padding: 10px 20px calc(var(--safe-b) + 24px);
    max-width: 600px; margin: 0 auto;
    box-shadow: 0 -4px 24px rgba(0,0,0,.08);
  }
  .sheet.show { transform: none; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: rgba(0,0,0,.15); margin: 6px auto 14px; }
  .sheet h3 { font-size: 17px; margin: 0 0 14px; font-weight: 700; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select {
    width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--card-2); color: var(--text); font-size: 15px; outline: none;
  }
  .field input:focus { border-color: var(--blue); }
  .hint { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-top: 6px; }
  .btn-primary {
    width: 100%; padding: 14px; border: none; border-radius: 14px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
    margin-top: 6px; transition: background .2s;
  }
  .btn-primary:active { background: var(--accent-dark); }
  .note { font-size: 12px; color: var(--text-dim); margin-top: 12px; line-height: 1.6; }
  .note b { color: var(--warn); }

  /* ---------- banner ---------- */
  .banner {
    display: none; border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.7;
    border: 1px solid rgba(255,149,0,.25); background: rgba(255,149,0,.06); color: #D96C00; margin-bottom: 14px;
  }
  .banner.show { display: block; }
  .banner a { color: var(--blue); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">译</div>
      <div>
        <h1>实时听译</h1>
        <p>对话场景 · 中英互译</p>
      </div>
    </div>
    <button class="icon-btn" id="openSettings" aria-label="设置">⚙</button>
  </header>

  <div class="banner" id="compatBanner"></div>

  <div class="status-bar">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">未开始 · 点击下方麦克风开始听译</span>
  </div>

  <div class="dir-switch">
    <div class="dir-card sel" data-dir="z2e" id="cardZ2E">
      <div class="lg">中文 → English</div>
      <div class="sub">对方说中文，你回英文</div>
    </div>
    <div class="dir-arrow">⇄</div>
    <div class="dir-card" data-dir="e2z" id="cardE2Z">
      <div class="lg">English → 中文</div>
      <div class="sub">对方说英文，你回中文</div>
    </div>
  </div>

  <div class="mic-zone">
    <button class="mic-btn" id="micBtn" aria-label="开始或停止听译">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
    </button>
    <div class="mic-label" id="micLabel">开始听译</div>
    <div class="mic-sub" id="micSub">识别语言：中文 · 译文：英文</div>
  </div>

  <div class="live-zone" id="liveZone">
    <div class="live-box">
      <span class="tag"><span class="b" id="liveTagSrc">识别（中）</span></span>
      <div id="interimText" class="placeholder">正在聆听……</div>
    </div>
    <div class="live-box">
      <span class="tag" id="liveTagDst">翻译（英）</span>
      <div id="transResult">…</div>
    </div>
  </div>

  <div class="text-zone" id="textZone">
    <div class="text-title">文本翻译 <span class="text-tip">语音不可用时的备用入口</span></div>
    <div class="text-row">
      <input id="textInput" type="text" placeholder="输入文字，自动按上方方向翻译" autocomplete="off">
      <button id="textSend">翻译</button>
    </div>
    <div class="text-done" id="textDone"></div>
  </div>

  <div class="session-head">
    <h2>会话记录</h2>
    <button id="clearBtn">清空</button>
  </div>
  <div id="sessionList"><div class="empty"><div class="big">🎙️</div>还没有记录，点麦克风开始吧</div></div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3>设置</h3>
  <div class="field">
    <label>翻译方向（听译）</label>
    <div class="dir-switch" style="margin:0">
      <div class="dir-card sel" data-dir2="z2e" id="setCardZ2E"><div class="lg">中 → 英</div><div class="sub">对方说中文</div></div>
      <div class="dir-arrow">⇄</div>
      <div class="dir-card" data-dir2="e2z" id="setCardE2Z"><div class="lg">英 → 中</div><div class="sub">对方说英文</div></div>
    </div>
  </div>
  <div class="field">
    <label>语音识别引擎</label>
    <select id="engineSel">
      <option value="iflytek">讯飞（推荐 · 境内可用）</option>
      <option value="native">浏览器内置（iPhone Safari）</option>
    </select>
  </div>
  <div class="hint">引擎说明：讯飞引擎在 Android / iOS 均可使用，iPhone Safari 仍可用浏览器内置引擎。切换后点击麦克风生效。</div>
  <button class="btn-primary" id="saveBtn">保存并关闭</button>
</div>

<div class="note" id="httpxNote" style="margin-top:18px"></div>

<script>
  /* ================= 工具函数 ================= */
  function $(id) { return document.getElementById(id); }

  /* ================= 讯飞配置 ================= */
  // 硬编码讯飞密钥（建议自行注册更换）
  var xconfig = {
    appId: "63e1b970",
    apiKey: "5d2791ab0134866b29d644fb78fb46ec",
    apiSecret: "NjFlNjMzNzEyNTFiNmE3YWY2MzFkOWEx",
    host: "iat-api.xfyun.cn",
    uri:  "/v2/iat"
  };

  /* ================= 状态 ================= */
  var cfg = { dir: "z2e", engine: "iflytek" };
  var ws = null, mediaRecorder = null, audioStream = null;
  var listening = false, startedOnce = false, restartFail = 0;
  var pendingQueue = [], translating = false;
  var lastFinalText = "";
  var nativeRec = null;

  /* ================= 方向配置 ================= */
  function dirInfo(mode) {
    if (mode === "z2e") return { srcLang: "zh-CN", srcTag: "中文", dstTag: "英文", micSub: "识别语言：中文 · 译文：英文", liveSrc: "识别（中）", liveDst: "翻译（英）", myFrom: "zh", myTo: "en" };
    return { srcLang: "en-US", srcTag: "英文", dstTag: "中文", micSub: "识别语言：英文 · 译文：中文", liveSrc: "识别（英）", liveDst: "翻译（中）", myFrom: "en", myTo: "zh" };
  }

  /* ================= 兼容检查 ================= */
  function showCompatBanner(issues) {
    var banner = $("compatBanner");
    banner.innerHTML = "⚠️ " + issues.join("<br>⚠️ ");
    banner.classList.add("show");
  }

  function compatCheck() {
    var banner = $("compatBanner");
    var msgs = [];
    if (!window.WebSocket) msgs.push("当前浏览器不支持 WebSocket，无法使用讯飞语音听写。");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) msgs.push("当前浏览器不支持麦克风采集。");
    if (msgs.length) {
      banner.innerHTML = "⚠️ " + msgs.join("<br>⚠️ ");
      banner.classList.add("show");
    }
  }

  /* ================= 讯飞鉴权（HMAC-SHA256） ================= */
  function toBase64(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function sign(raw, key) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(key), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]).then(function (k) {
      return crypto.subtle.sign("HMAC", k, enc.encode(raw));
    });
  }
  function arrayToBase64(buf) {
    var bytes = new Uint8Array(buf);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function buildAuthUrl() {
    var date = new Date().toUTCString();
    var signatureOrigin = "host: " + xconfig.host + "\ndate: " + date + "\nGET " + xconfig.uri + " HTTP/1.1";
    return sign(signatureOrigin, xconfig.apiSecret).then(function (sig) {
      var signature = arrayToBase64(sig);
      var authorizationOrigin = 'api_key="' + xconfig.apiKey + '", algorithm="hmac-sha256", headers="host date request-line", signature="' + signature + '"';
      var authorization = toBase64(authorizationOrigin);
      return "wss://" + xconfig.host + xconfig.uri + "?authorization=" + encodeURIComponent(authorization) + "&date=" + encodeURIComponent(date) + "&host=" + encodeURIComponent(xconfig.host);
    });
  }

  /* ================= 音频采集 ================= */
  var audioCtx = null, sourceNode = null, processorNode = null;
  function startAudioCapture(onChunk) {
    return navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true } }).then(function (stream) {
      audioStream = stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      sourceNode = audioCtx.createMediaStreamSource(stream);
      var bufferSize = 4096;
      processorNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
      processorNode.onaudioprocess = function (e) {
        var input = e.inputBuffer.getChannelData(0);
        var len = input.length;
        var pcm = new Int16Array(len);
        for (var i = 0; i < len; i++) {
          var s = Math.max(-1, Math.min(1, input[i]));
          pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        onChunk(pcm);
      };
      sourceNode.connect(processorNode);
      processorNode.connect(audioCtx.destination);
      return true;
    });
  }
  function stopAudioCapture() {
    if (processorNode) { processorNode.disconnect(); processorNode.onaudioprocess = null; processorNode = null; }
    if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (audioStream) { audioStream.getTracks().forEach(function (t) { t.stop(); }); audioStream = null; }
  }

  /* ================= 讯飞 WebSocket 启动 ================= */
  function startIflytek() {
    if (!window.WebSocket) { setStatus("浏览器不支持 WebSocket", "err"); return; }
    buildAuthUrl().then(function (url) {
      ws = new WebSocket(url);
      ws.binaryType = "arraybuffer";
      var audioBuffer = [];
      var totalLen = 0;

      ws.onopen = function () {
        startedOnce = true; restartFail = 0;
        setStatus("正在聆听…… 说完一句自动翻译", "on");
        startAudioCapture(function (pcm) {
          if (!listening || !ws || ws.readyState !== 1) return;
          audioBuffer.push(pcm);
          totalLen += pcm.length;
          // 每 0.3s 或 4096 样本发送一次
          if (totalLen >= 4096) {
            var combined = new Int16Array(totalLen);
            var offset = 0;
            for (var i = 0; i < audioBuffer.length; i++) { combined.set(audioBuffer[i], offset); offset += audioBuffer[i].length; }
            audioBuffer = []; totalLen = 0;
            var base64 = arrayBufferToBase64(combined.buffer);
            sendAudioFrame(base64, false);
          }
        }).then(function () {
          // 首帧
          sendAudioFrame("", true);
        }).catch(function (err) {
          setStatus("无法获取麦克风：" + err.message, "err");
          stopIflytek();
        });
      };

      ws.onmessage = function (evt) {
        var data = JSON.parse(evt.data);
        if (data.code !== 0) { setStatus("讯飞错误：" + data.message, "err"); stopIflytek(); return; }
        var res = data.data;
        if (res && res.result) {
          var wsResult = res.result.ws || [];
          var text = "";
          for (var i = 0; i < wsResult.length; i++) { text += wsResult[i].cw[0].w; }
          var status = res.status;
          if (status === 2 || status === 0) {
            if (text && text !== lastFinalText) {
              lastFinalText = text;
              pendingQueue.push(text);
              pumpQueue();
            }
          }
          showInterim(text || "正在聆听……");
        }
        if (res && res.status === 2) {
          // 讯飞判定一句话结束，自动开启新会话继续听
          setTimeout(function () { if (listening) startIflytek(); }, 300);
        }
      };

      ws.onerror = function () { setStatus("连接出错，正在重试…", "err"); retryIflytek(); };
      ws.onclose = function () { if (listening) retryIflytek(); };
    }).catch(function (err) {
      setStatus("鉴权失败：" + err.message, "err");
    });
  }

  function sendAudioFrame(base64, isFirst) {
    var frame = {
      common: { app_id: xconfig.appId },
      business: { language: cfg.dir === "z2e" ? "zh_cn" : "en_us", domain: "iat", accent: "mandarin", vad_eos: 3000, dwa: "wpgs" },
      data: { status: isFirst ? 0 : 1, format: "audio/L16;rate=16000", encoding: "raw", audio: base64 }
    };
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(frame));
  }

  function arrayBufferToBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var bin = "";
    for (var i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function retryIflytek() {
    restartFail++;
    if (restartFail > 3) { setStatus("连接多次失败，已停止。请检查网络后重试。", "err"); stopIflytek(); return; }
    setTimeout(function () { if (listening) startIflytek(); }, 800);
  }

  function stopIflytek() {
    listening = false; startedOnce = false;
    if (ws) { ws.close(); ws = null; }
    stopAudioCapture();
    setMicUI(false);
    setStatus("已停止", "");
    $("liveZone").classList.remove("show");
  }

  /* ================= 浏览器原生语音识别 ================= */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function startNative() {
    if (!SR) { setStatus("当前浏览器不支持语音识别", "err"); return; }
    var d = dirInfo(cfg.dir);
    nativeRec = new SR();
    nativeRec.lang = d.srcLang;
    nativeRec.continuous = true;
    nativeRec.interimResults = true;
    nativeRec.maxAlternatives = 1;

    nativeRec.onstart = function () {
      startedOnce = true; restartFail = 0;
      setStatus("正在聆听…… 说完一句自动翻译", "on");
    };
    nativeRec.onresult = function (ev) {
      var interim = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var r = ev.results[i];
        if (r.isFinal) {
          var t = (r[0] && r[0].transcript || "").trim();
          if (t) { pendingQueue.push(t); pumpQueue(); }
        } else if (r[0] && r[0].transcript) { interim += r[0].transcript; }
      }
      showInterim(interim || "正在聆听……");
    };
    nativeRec.onerror = function (ev) {
      if (ev.error === "not-allowed") { setStatus("麦克风权限被拒绝，请在设置中开启", "err"); stopNative(); return; }
      if (ev.error === "network") { setStatus("网络错误（安卓版 Chrome 依赖 Google 服务境内不可用）", "err"); }
      else { setStatus("识别错误：" + ev.error, "err"); }
      if (listening && restartFail < 3) { restartFail++; setTimeout(function () { if (listening) startNative(); }, 600); }
      else { stopNative(); }
    };
    nativeRec.onend = function () {
      if (!startedOnce && restartFail < 3) { restartFail++; setTimeout(function () { if (listening) startNative(); }, 400); }
      else if (listening) { setTimeout(function () { if (listening) startNative(); }, 200); }
    };
    nativeRec.start();
  }
  function stopNative() {
    listening = false; startedOnce = false;
    if (nativeRec) { try { nativeRec.stop(); } catch(e){} nativeRec = null; }
    setMicUI(false); setStatus("已停止", ""); $("liveZone").classList.remove("show");
  }

  /* ================= 公共控制 ================= */
  function startListening() {
    listening = true; lastFinalText = "";
    $("liveZone").classList.add("show");
    $("interimText").textContent = "正在聆听……"; $("interimText").classList.add("placeholder");
    $("transResult").textContent = "…";
    if (cfg.engine === "iflytek") startIflytek(); else startNative();
  }
  function stopListening(manual) {
    listening = false; restartFail = 0; startedOnce = false;
    if (cfg.engine === "iflytek") stopIflytek(); else stopNative();
  }

  /* ================= 翻译 ================= */
  function translateText(text, from, to) {
    var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + from + "|" + to;
    return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      if (j.responseStatus === 200) return j.responseData.translatedText;
      throw new Error(j.responseDetails || "翻译失败");
    });
  }
  function pumpQueue() {
    if (translating || !pendingQueue.length) return;
    translating = true;
    var t = pendingQueue.shift();
    var d = dirInfo(cfg.dir);
    translateText(t, d.myFrom, d.myTo)
      .then(function (trans) { addSegment(t, trans, d); translating = false; pumpQueue(); })
      .catch(function (err) { addSegment(t, "", d, err.message); translating = false; pumpQueue(); });
  }

  /* ================= UI 辅助 ================= */
  function showInterim(text) {
    var el = $("interimText");
    el.textContent = text || "正在聆听……";
    el.classList.toggle("placeholder", !text);
  }
  function setStatus(text, mode) {
    $("statusText").textContent = text;
    var dot = $("statusDot");
    dot.className = "dot" + (mode ? " " + mode : "");
  }
  function setMicUI(on) {
    var btn = $("micBtn"), label = $("micLabel");
    btn.classList.toggle("active", on);
    label.textContent = on ? "停止听译" : "开始听译";
  }
  function addSegment(src, dst, d, errMsg) {
    var list = $("sessionList");
    if (list.children.length === 1 && list.children[0].classList.contains("empty")) list.innerHTML = "";
    var seg = document.createElement("div"); seg.className = "seg";
    var ts = new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    var copy = document.createElement("button"); copy.className = "copy";
    copy.textContent = "复制";
    copy.onclick = function () { copyText(dst || src, copy); };
    seg.innerHTML =
      '<div class="meta"><span class="badge ' + (cfg.dir === "e2z" ? "en" : "zh") + '">' + d.srcTag + '</span>' +
      '<span class="time">' + ts + '</span></div>' +
      '<div class="src"></div>' +
      '<div class="dst"></div>';
    seg.querySelector(".src").textContent = src;
    var dstEl = seg.querySelector(".dst");
    if (dst) { dstEl.textContent = dst; } else { dstEl.textContent = "翻译失败：" + (errMsg || "未知错误"); dstEl.className += " failed"; }
    seg.appendChild(copy);
    list.prepend(seg);
    while (list.children.length > 40) list.removeChild(list.lastChild);
  }
  function copyText(text, btn) {
    function done(ok) {
      if (btn) { btn.textContent = ok ? "已复制" : "复制"; if (ok) setTimeout(function () { btn.textContent = "复制"; }, 1400); }
      if (!ok) setStatus("复制失败（需要 https 环境）", "err");
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { legacyCopy(text, done); });
    } else { legacyCopy(text, done); }
  }
  function legacyCopy(text, done) {
    try { var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); var ok = document.execCommand("copy"); document.body.removeChild(ta); done(ok); } catch (e) { done(false); }
  }

  /* ================= 方向切换 ================= */
  function applyDir(mode) {
    cfg.dir = mode; saveCfg();
    var d = dirInfo(mode);
    document.querySelectorAll(".dir-card[data-dir]").forEach(function (el) { el.classList.toggle("sel", el.getAttribute("data-dir") === mode); });
    document.querySelectorAll(".dir-card[data-dir2]").forEach(function (el) { el.classList.toggle("sel", el.getAttribute("data-dir2") === mode); });
    $("micSub").textContent = listening ? "正在实时听译，点击停止" : d.micSub;
    $("liveTagSrc").textContent = d.liveSrc;
    $("liveTagDst").textContent = d.liveDst;
    if (listening) { stopListening(false); setTimeout(startListening, 150); }
  }

  /* ================= 设置面板 ================= */
  function openSheet() { $("sheet").classList.add("show"); $("mask").classList.add("show"); }
  function closeSheet() { $("sheet").classList.remove("show"); $("mask").classList.remove("show"); }
  function refreshSheetSel() {
    $("setCardZ2E").classList.toggle("sel", cfg.dir === "z2e");
    $("setCardE2Z").classList.toggle("sel", cfg.dir === "e2z");
    $("engineSel").value = cfg.engine;
  }
  function saveAndClose() { cfg.engine = $("engineSel").value; saveCfg(); closeSheet(); }

  /* ================= 存储 ================= */
  function saveCfg() { try { localStorage.setItem("e2c_cfg", JSON.stringify(cfg)); } catch(e){} }
  function loadCfg() { try { var s = localStorage.getItem("e2c_cfg"); if (s) cfg = JSON.parse(s); } catch(e){} }

  /* ================= PWA ================= */
  function setupPWA() {
    var icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233d7bff'/%3E%3Ctext x='50' y='65' font-size='48' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23fff'%3E译%3C/text%3E%3C/svg%3E";
    var manifest = { name: "实时听译 - 中英对话翻译", short_name: "实时听译", description: "手机麦克风实时听取对话并中英互译", start_url: location.href.split("#")[0], display: "standalone", background_color: "#F5F5F7", theme_color: "#F5F5F7", lang: "zh-CN", icons: [{ src: icon, sizes: "192x192", type: "image/png", purpose: "any" }] };
    var m = document.createElement("link"); m.rel = "manifest"; m.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest)); document.head.appendChild(m);
  }

  /* ================= 事件绑定 ================= */
  function init() {
    loadCfg(); applyDir(cfg.dir); compatCheck(); setupPWA();
    $("micBtn").onclick = function () {
      if (listening) { stopListening(true); setMicUI(false); return; }
      setStatus("正在请求麦克风权限…", "");
      startListening(); setMicUI(true);
    };
    document.querySelectorAll(".dir-card[data-dir]").forEach(function (el) { el.onclick = function () { applyDir(el.getAttribute("data-dir")); }; });
    document.querySelectorAll(".dir-card[data-dir2]").forEach(function (el) { el.onclick = function () { applyDir(el.getAttribute("data-dir2")); refreshSheetSel(); }; });
    $("openSettings").onclick = function () { refreshSheetSel(); openSheet(); };
    $("mask").onclick = closeSheet;
    $("saveBtn").onclick = saveAndClose;
    $("clearBtn").onclick = function () { if (confirm("确定清空全部会话记录吗？")) { $("sessionList").innerHTML = '<div class="empty"><div class="big">🎙️</div>还没有记录，点麦克风开始吧</div>'; } };

    function doTextTranslate() {
      var input = $("textInput"); var text = input.value.trim(); if (!text) return;
      var d = dirInfo(cfg.dir); var done = $("textDone");
      done.classList.remove("show"); $("transResult").classList.add("loading"); $("transResult").textContent = "翻译中…";
      translateText(text, d.myFrom, d.myTo)
        .then(function (trans) { addSegment(text, trans, d); done.textContent = "译文：" + trans; done.classList.add("show"); $("transResult").classList.remove("loading"); $("transResult").textContent = trans; input.value = ""; })
        .catch(function (err) { done.textContent = "翻译失败：" + err.message; done.classList.add("show"); $("transResult").classList.remove("loading"); $("transResult").textContent = "翻译失败"; });
    }
    $("textSend").onclick = doTextTranslate;
    $("textInput").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doTextTranslate(); } });

    var note = $("httpxNote");
    if (location.protocol === "https:") note.innerHTML = "📌 数据说明：语音识别与翻译均在设备浏览器中实时完成，不上传你的语音录音，仅将识别出的文字发送给翻译服务。";
    else if (location.protocol === "file:") note.innerHTML = "📌 <b>重要：</b>以 file:// 直接打开时，iPhone Safari 限制麦克风访问。<br>推荐部署到任意 https 静态托管（如 GitHub Pages），手机访问网址即可使用。";
    else note.innerHTML = "📌 当前为 http 访问。iOS 语音识别需要 https，建议部署到 https 地址后使用。";
  }

  window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
