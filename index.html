<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>E2C · 实时翻译</title>
<meta name="theme-color" content="#1D1D1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-2: #2C2C2E;
    --text: #FFFFFF;
    --text-2: #8E8E93;
    --text-3: #636366;
    --accent: #FF3B30;
    --accent-soft: rgba(255,59,48,0.15);
    --blue: #0A84FF;
    --green: #30D158;
    --yellow: #FFD60A;
    --line: rgba(255,255,255,0.08);
    --radius: 16px;
    --radius-sm: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  .app { flex: 1; max-width: 480px; margin: 0 auto; width: 100%; padding: var(--safe-top) 0 0; position: relative; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; position: sticky; top: 0; z-index: 10;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header .sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--surface); color: var(--text-2); font-size: 18px;
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { transform: scale(0.92); }

  /* Direction Switch */
  .dir-bar {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px;
    align-items: center; padding: 0 20px; margin: 8px 0 16px;
  }
  .dir-pill {
    background: var(--surface); border-radius: var(--radius-sm);
    padding: 10px 14px; text-align: center; cursor: pointer;
    border: 1.5px solid transparent; transition: all 0.2s;
  }
  .dir-pill .lang { font-size: 14px; font-weight: 600; }
  .dir-pill .sub { font-size: 10px; color: var(--text-3); margin-top: 2px; }
  .dir-pill.active { border-color: var(--accent); background: var(--accent-soft); }
  .dir-pill.active .lang { color: var(--accent); }
  .dir-arrow { color: var(--text-3); font-size: 14px; }

  /* Customer Selector */
  .customer-bar {
    margin: 0 20px 16px; padding: 12px 14px;
    background: var(--surface); border-radius: var(--radius-sm);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    border: 1.5px solid transparent; transition: border-color 0.2s;
  }
  .customer-bar:active { border-color: var(--accent); }
  .customer-bar .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); display: grid; place-items: center;
    font-size: 14px; font-weight: 700; color: #fff; flex: none;
  }
  .customer-bar .info { flex: 1; min-width: 0; }
  .customer-bar .name { font-size: 14px; font-weight: 600; }
  .customer-bar .hint { font-size: 11px; color: var(--text-3); }
  .customer-bar .arrow { color: var(--text-3); font-size: 12px; }

  /* Mic Zone */
  .mic-zone {
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 0 16px;
  }
  .mic-btn {
    width: 100px; height: 100px; border-radius: 50%; border: none;
    background: var(--accent); cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 0 40px rgba(255,59,48,0.3), 0 4px 20px rgba(255,59,48,0.2);
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
  }
  .mic-btn:active { transform: scale(0.95); }
  .mic-btn.recording {
    background: var(--surface); border: 3px solid var(--accent);
    animation: micPulse 2s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255,59,48,0.2); }
    50% { box-shadow: 0 0 60px rgba(255,59,48,0.5); }
  }
  .mic-btn svg { width: 40px; height: 40px; fill: #fff; }
  .mic-btn.recording svg { fill: var(--accent); }
  .mic-hint { margin-top: 12px; font-size: 13px; color: var(--text-2); }
  .mic-hint.recording { color: var(--accent); }

  /* Speaker Switch */
  .speaker-bar {
    display: flex; gap: 8px; justify-content: center;
    padding: 10px 20px 4px;
  }
  .speaker-btn {
    flex: 1; max-width: 200px; padding: 10px 14px;
    border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--surface); color: var(--text-2);
    font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.2s;
  }
  .speaker-btn.active { border-color: var(--blue); background: rgba(10,132,255,0.15); color: var(--blue); }
  .speaker-btn:disabled { opacity: 0.5; }

  /* Real-time Display */
  .rt-zone { padding: 0 20px; margin-bottom: 16px; }
  .rt-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px;
    border: 1px solid var(--line);
  }
  .rt-card .label {
    font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .rt-card .label .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-3);
  }
  .rt-card .label .dot.active { background: var(--green); animation: blink 1.5s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .rt-card .text {
    font-size: 17px; line-height: 1.5; min-height: 28px;
    word-break: break-word;
  }
  .rt-card .text.placeholder { color: var(--text-3); }
  .rt-card .trans {
    font-size: 15px; color: var(--text-2); line-height: 1.5;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
    min-height: 24px;
  }
  .rt-card .trans:empty { display: none; }

  /* Insight Panel */
  .insight-zone { padding: 0 20px; margin-bottom: 16px; }
  .insight-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 14px 16px; border: 1px solid var(--line);
  }
  .insight-card .title {
    font-size: 12px; font-weight: 700; color: var(--text-3);
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .insight-card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 12px; font-weight: 600; padding: 5px 10px;
    border-radius: 20px; background: var(--surface-2); color: var(--text-2);
  }
  .tag.hot { background: var(--accent-soft); color: var(--accent); }
  .tag.product { background: rgba(10,132,255,0.15); color: var(--blue); }
  .products-list { display: flex; flex-direction: column; gap: 6px; }
  .product-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 10px;
    background: rgba(255,59,48,0.08); cursor: pointer;
  }
  .product-item:active { background: rgba(255,59,48,0.15); }
  .product-item .model { font-weight: 700; font-size: 13px; color: var(--accent); }
  .product-item .desc { font-size: 12px; color: var(--text-2); flex: 1; }

  /* Quick Save */
  .quick-save {
    padding: 0 20px; margin-bottom: 20px;
  }
  .save-btn {
    width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
    background: var(--surface-2); color: var(--text); font-size: 15px;
    font-weight: 600; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s;
  }
  .save-btn:active { background: var(--surface); }
  .save-btn.primary { background: var(--accent); color: #fff; }
  .save-btn.primary:active { opacity: 0.9; }

  /* Tab Bar */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-around; align-items: center;
    padding: 8px 0 calc(8px + var(--safe-bottom));
    background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--line); z-index: 100;
    max-width: 480px; margin: 0 auto;
  }
  .tab-item {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; padding: 4px 16px; cursor: pointer;
    color: var(--text-3); text-decoration: none;
    transition: color 0.2s; border: none; background: none;
  }
  .tab-item.active { color: var(--accent); }
  .tab-item .icon { font-size: 22px; }
  .tab-item .label { font-size: 10px; font-weight: 600; }

  /* Modal */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
    z-index: 200; backdrop-filter: blur(4px);
  }
  .modal-mask.show { opacity: 1; pointer-events: auto; }
  .modal-sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(20px + var(--safe-bottom));
    transform: translateY(105%); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.25, 1);
    z-index: 210; max-width: 480px; margin: 0 auto;
    max-height: 80vh; overflow-y: auto;
  }
  .modal-sheet.show { transform: translateY(0); }
  .modal-sheet h3 { font-size: 18px; margin-bottom: 16px; }
  .modal-sheet .input-group { margin-bottom: 14px; }
  .modal-sheet label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 600; }
  .modal-sheet input, .modal-sheet textarea, .modal-sheet select {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--surface-2);
    color: var(--text); font-size: 15px; outline: none;
    font-family: inherit;
  }
  .modal-sheet input:focus, .modal-sheet textarea:focus { border-color: var(--accent); }
  .modal-sheet textarea { min-height: 80px; resize: vertical; }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn-row button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-row .cancel { background: var(--surface-2); color: var(--text); }
  .btn-row .confirm { background: var(--accent); color: #fff; }

  /* Toast */
  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--surface-2); color: var(--text); padding: 12px 24px;
    border-radius: 12px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
    z-index: 300; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* History list in modal */
  .history-list { max-height: 300px; overflow-y: auto; }
  .history-item {
    padding: 12px; border-radius: 12px; background: var(--surface-2);
    margin-bottom: 8px; cursor: pointer;
  }
  .history-item:active { background: var(--surface); }
  .history-item .time { font-size: 11px; color: var(--text-3); }
  .history-item .preview { font-size: 13px; margin-top: 4px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>实时翻译</h1>
      <div class="sub" id="statusText">点击麦克风开始</div>
    </div>
    <button class="icon-btn" onclick="showSettings()">⚙</button>
  </div>

  <div class="dir-bar">
    <div class="dir-pill active" data-dir="z2e" id="dirZ2E">
      <div class="lang">中文</div>
      <div class="sub">对方说</div>
    </div>
    <div class="dir-arrow">→</div>
    <div class="dir-pill" data-dir="e2z" id="dirE2Z">
      <div class="lang">English</div>
      <div class="sub">对方说</div>
    </div>
  </div>

  <div class="customer-bar" id="customerBar" onclick="showCustomerModal()">
    <div class="avatar" id="customerAvatar">+</div>
    <div class="info">
      <div class="name" id="customerName">选择客户</div>
      <div class="hint" id="customerHint">录音将关联到此客户档案</div>
    </div>
    <div class="arrow">›</div>
  </div>

  <div class="mic-zone">
    <button class="mic-btn" id="micBtn" onclick="toggleRecording()">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
    </button>
    <div class="mic-hint" id="micHint">点击说话</div>
  </div>

  <div class="speaker-bar">
    <button class="speaker-btn" id="speakerCustomer" onclick="setSpeaker('customer')">🧑💼 客户</button>
    <button class="speaker-btn" id="speakerMe" onclick="setSpeaker('me')">🙋 我</button>
  </div>

  <div class="rt-zone">
    <div class="rt-card">
      <div class="label"><span class="dot" id="srcDot"></span><span id="srcLabel">识别原文</span></div>
      <div class="text placeholder" id="srcText">等待语音输入...</div>
      <div class="trans" id="dstText"></div>
    </div>
  </div>

  <div class="insight-zone" id="insightZone" style="display:none">
    <div class="insight-card">
      <div class="title">💡 实时洞察</div>
      <div class="tags" id="insightTags"></div>
    </div>
  </div>

  <div class="quick-save" id="saveZone" style="display:none">
    <button class="save-btn primary" onclick="saveConversation()">💾 保存到客户档案</button>
  </div>

  <div style="height:100px"></div>
</div>

<!-- Tab Bar -->
<nav class="tab-bar">
  <a class="tab-item active" href="index.html">
    <span class="icon">🎙️</span>
    <span class="label">翻译</span>
  </a>
  <a class="tab-item" href="customers.html">
    <span class="icon">👥</span>
    <span class="label">客户</span>
  </a>
</nav>

<!-- Customer Modal -->
<div class="modal-mask" id="customerMask" onclick="hideCustomerModal()"></div>
<div class="modal-sheet" id="customerSheet">
  <h3>关联客户</h3>
  <div class="input-group">
    <label>新建客户</label>
    <input type="text" id="newCustomerName" placeholder="公司名或客户名称">
  </div>
  <div class="input-group">
    <label>联系人</label>
    <input type="text" id="newCustomerContact" placeholder="联系人姓名（可选）">
  </div>
  <div class="btn-row">
    <button class="cancel" onclick="hideCustomerModal()">取消</button>
    <button class="confirm" onclick="createCustomer()">创建并关联</button>
  </div>
  <div style="margin-top:20px">
    <label>或选择现有客户</label>
    <div class="history-list" id="customerList"></div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-mask" id="settingsMask" onclick="hideSettings()"></div>
<div class="modal-sheet" id="settingsSheet">
  <h3>设置</h3>
  <div class="input-group">
    <label>语音识别引擎</label>
    <select id="engineSel">
      <option value="iflytek">讯飞听写（推荐）</option>
      <option value="native">浏览器内置</option>
    </select>
  </div>
  <div class="input-group">
    <label>大模型 API Key（用于智能分析）</label>
    <input type="text" id="llmKey" placeholder="千帆/文心/讯飞等平台的 API Key">
    <div style="font-size:11px;color:var(--text-3);margin-top:4px">留空则仅使用本地规则分析</div>
  </div>
  <div class="btn-row">
    <button class="cancel" onclick="hideSettings()">取消</button>
    <button class="confirm" onclick="saveSettings()">保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ================= 数据层 =================
const DB = {
  getCustomers() {
    try { return JSON.parse(localStorage.getItem('e2c_customers') || '[]'); }
    catch(e) { return []; }
  },
  saveCustomers(list) {
    localStorage.setItem('e2c_customers', JSON.stringify(list));
  },
  getConversations() {
    try { return JSON.parse(localStorage.getItem('e2c_conversations') || '[]'); }
    catch(e) { return []; }
  },
  saveConversations(list) {
    localStorage.setItem('e2c_conversations', JSON.stringify(list));
  },
  getSettings() {
    try { return JSON.parse(localStorage.getItem('e2c_settings') || '{}'); }
    catch(e) { return {}; }
  },
  saveSettings(s) {
    localStorage.setItem('e2c_settings', JSON.stringify(s));
  },
  generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
  }
};

// ================= 讯飞配置 =================
const xconfig = {
  appId: "63e1b970",
  apiKey: "5d2791ab0134866b29d644fb78fb46ec",
  apiSecret: "NjFlNjMzNzEyNTFiNmE3YWY2MzFkOWEx",
  host: "iat-api.xfyun.cn",
  uri: "/v2/iat"
};

// ================= 状态 =================
let cfg = { dir: 'z2e', engine: 'iflytek', llmKey: '' };
let ws = null, audioCtx = null, sourceNode = null, processorNode = null;
let audioStream = null, frameInterval = null, silenceTimer = null;
let isRecording = false, currentSession = null;
let currentCustomer = null;
let currentSpeaker = 'customer';
let insightTags = [], matchedProducts = [];

// ================= 产品库 =================
const GXYKIT_PRODUCTS = [
  { model: "GC01", name: "Smart USB Car Charger", category: "Car Charger", keywords: ["120W","3 USB","LED"], sellingPoints: ["120W","3 USB Ports","LED Lights"] },
  { model: "GC05", name: "Car Charger", category: "Car Charger", keywords: ["QC3.0","3 USB","LED"], sellingPoints: ["QC3.0","3 USB Ports","LED Lights"] },
  { model: "GC13", name: "多设备扩展车充", category: "Car Charger", keywords: ["PD","45W","retractable"], sellingPoints: ["PD Fast Charge","Retractable"] },
  { model: "GC15", name: "Car Charger", category: "Car Charger", keywords: ["65W","retractable","LED"], sellingPoints: ["65W","Retractable","LED Lights"] },
  { model: "GC21", name: "Car Charger", category: "Car Charger", keywords: ["83W","retractable"], sellingPoints: ["83W","Retractable"] },
  { model: "GC21-Z", name: "Car Charger", category: "Car Charger", keywords: ["BT 5.4","83W","retractable"], sellingPoints: ["BT 5.4","83W","Retractable"] },
  { model: "GC25", name: "伸缩线车充", category: "Car Charger", keywords: ["PD","retractable","LED"], sellingPoints: ["PD Fast Charge","Retractable","LED Lights"] },
  { model: "GZ11", name: "Car MP3 Player", category: "Car MP3", keywords: ["BT 5.3","retractable","LED"], sellingPoints: ["BT 5.3","Retractable","LED Lights"] },
  { model: "G21", name: "Car FM Transmitter", category: "FM Transmitter", keywords: ["BT 5.3","3 USB","FM"], sellingPoints: ["BT 5.3","3 USB Ports"] },
  { model: "G63", name: "Car FM Transmitter", category: "FM Transmitter", keywords: ["BT 5.3","FM"], sellingPoints: ["BT 5.3"] },
  { model: "GR05", name: "Bluetooth Transceiver", category: "Bluetooth TX/RX", keywords: ["BT 5.3"], sellingPoints: ["BT 5.3"] },
  { model: "GR11", name: "BT Audio RX/TX 2-in-1", category: "Bluetooth TX/RX", keywords: ["BT 5.4","USB-C"], sellingPoints: ["BT 5.4","USB-C"] }
];

// ================= 初始化 =================
function init() {
  const saved = DB.getSettings();
  cfg = { ...cfg, ...saved };
  updateDirUI();
  setSpeaker('customer');
  loadCurrentCustomer();
  document.getElementById('engineSel').value = cfg.engine;
  document.getElementById('llmKey').value = cfg.llmKey || '';
}

function updateDirUI() {
  document.getElementById('dirZ2E').classList.toggle('active', cfg.dir === 'z2e');
  document.getElementById('dirE2Z').classList.toggle('active', cfg.dir === 'e2z');
  document.getElementById('srcLabel').textContent = cfg.dir === 'z2e' ? '中文识别' : 'English Recognition';
}

function setSpeaker(who) {
  currentSpeaker = who;
  document.getElementById('speakerCustomer').classList.toggle('active', who === 'customer');
  document.getElementById('speakerMe').classList.toggle('active', who === 'me');
}

// ================= 客户管理 =================
function loadCurrentCustomer() {
  const id = sessionStorage.getItem('e2c_active_customer');
  if (id) {
    const customers = DB.getCustomers();
    currentCustomer = customers.find(c => c.id === id) || null;
  }
  updateCustomerBar();
}

function updateCustomerBar() {
  const bar = document.getElementById('customerBar');
  const avatar = document.getElementById('customerAvatar');
  const name = document.getElementById('customerName');
  const hint = document.getElementById('customerHint');
  if (currentCustomer) {
    avatar.textContent = currentCustomer.name.charAt(0).toUpperCase();
    name.textContent = currentCustomer.name;
    hint.textContent = currentCustomer.contact || '点击更换客户';
    bar.style.borderColor = 'var(--accent)';
  } else {
    avatar.textContent = '+';
    name.textContent = '选择客户';
    hint.textContent = '未选择 · 结束时可关联';
    bar.style.borderColor = 'transparent';
  }
}

function showCustomerModal() {
  document.getElementById('customerMask').classList.add('show');
  document.getElementById('customerSheet').classList.add('show');
  renderCustomerList();
}

function hideCustomerModal() {
  document.getElementById('customerMask').classList.remove('show');
  document.getElementById('customerSheet').classList.remove('show');
}

function renderCustomerList() {
  const list = document.getElementById('customerList');
  const customers = DB.getCustomers();
  if (!customers.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-3);padding:20px;font-size:13px">暂无客户，上方创建新客户</div>';
    return;
  }
  list.innerHTML = customers.map(c => `
    <div class="history-item" onclick="selectCustomer('${c.id}')">
      <div class="time">${new Date(c.createdAt).toLocaleDateString('zh-CN')}</div>
      <div class="preview">${c.name} ${c.contact ? '· ' + c.contact : ''}</div>
    </div>
  `).join('');
}

function createCustomer() {
  const name = document.getElementById('newCustomerName').value.trim();
  if (!name) { showToast('请输入客户名称'); return; }
  const contact = document.getElementById('newCustomerContact').value.trim();
  const customer = {
    id: DB.generateId(),
    name, contact,
    createdAt: new Date().toISOString(),
    tags: [], notes: ''
  };
  const customers = DB.getCustomers();
  customers.unshift(customer);
  DB.saveCustomers(customers);
  currentCustomer = customer;
  sessionStorage.setItem('e2c_active_customer', customer.id);
  updateCustomerBar();
  hideCustomerModal();
  document.getElementById('newCustomerName').value = '';
  document.getElementById('newCustomerContact').value = '';
  saveCurrentSession();
}

function selectCustomer(id) {
  const customers = DB.getCustomers();
  currentCustomer = customers.find(c => c.id === id) || null;
  if (currentCustomer) {
    sessionStorage.setItem('e2c_active_customer', id);
    updateCustomerBar();
    hideCustomerModal();
    saveCurrentSession();
  }
}

// ================= 录音控制 =================
function toggleRecording() {
  if (isRecording) stopRecording();
  else startRecording();
}

function startRecording() {
  isRecording = true;
  currentSession = {
    id: DB.generateId(),
    customerId: currentCustomer ? currentCustomer.id : null,
    startTime: new Date().toISOString(),
    segments: [],
    signals: [],
    products: []
  };
  insightTags = []; matchedProducts = [];
  updateRecordingUI(true);
  if (cfg.engine === 'iflytek') startIflytek();
  else startNative();
}

function stopRecording() {
  isRecording = false;
  updateRecordingUI(false);
  if (cfg.engine === 'iflytek') stopIflytek();
  else stopNative();
  if (currentSession && currentSession.segments.length > 0) {
    document.getElementById('saveZone').style.display = 'block';
    generateInsight();
    // 如果未关联客户，结束时弹出关联窗口
    if (!currentCustomer) showCustomerModal();
  }
}

function updateRecordingUI(recording) {
  const btn = document.getElementById('micBtn');
  const hint = document.getElementById('micHint');
  const dot = document.getElementById('srcDot');
  btn.classList.toggle('recording', recording);
  hint.textContent = recording ? '正在录音...' : '点击开始录音';
  hint.classList.toggle('recording', recording);
  dot.classList.toggle('active', recording);
}

// ================= 讯飞语音 =================
function buildAuthUrl() {
  const date = new Date().toUTCString();
  const signatureOrigin = `host: ${xconfig.host}\ndate: ${date}\nGET ${xconfig.uri} HTTP/1.1`;
  const encoder = new TextEncoder();
  return crypto.subtle.importKey('raw', encoder.encode(xconfig.apiSecret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'])
    .then(key => crypto.subtle.sign('HMAC', key, encoder.encode(signatureOrigin)))
    .then(sig => {
      const signature = btoa(String.fromCharCode(...new Uint8Array(sig)));
      const auth = btoa(`api_key="${xconfig.apiKey}", algorithm="hmac-sha256", headers="host date request-line", signature="${signature}"`);
      return `wss://${xconfig.host}${xconfig.uri}?authorization=${encodeURIComponent(auth)}&date=${encodeURIComponent(date)}&host=${encodeURIComponent(xconfig.host)}`;
    });
}

function startIflytek() {
  buildAuthUrl().then(url => {
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';
    let audioBuffer = [], totalLen = 0;
    let isSpeaking = false;

    ws.onopen = () => {
      document.getElementById('statusText').textContent = '正在聆听...';
      navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true } })
        .then(stream => {
          audioStream = stream;
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const sourceRate = audioCtx.sampleRate;
          const ratio = 16000 / sourceRate;
          sourceNode = audioCtx.createMediaStreamSource(stream);
          processorNode = audioCtx.createScriptProcessor(2048, 1, 1);
          processorNode.onaudioprocess = e => {
            if (!isRecording) return;
            const input = e.inputBuffer.getChannelData(0);
            const outLen = Math.max(1, Math.floor(input.length * ratio));
            const pcm = new Int16Array(outLen);
            for (let i = 0; i < outLen; i++) {
              const idx = i / ratio;
              const i0 = Math.floor(idx);
              const frac = idx - i0;
              let v = input[i0] + ((input[i0 + 1] || input[i0]) - input[i0]) * frac;
              v = Math.max(-1, Math.min(1, v));
              pcm[i] = v < 0 ? v * 0x8000 : v * 0x7FFF;
            }
            // Voice activity detection
            let energy = 0;
            for (let k = 0; k < Math.min(pcm.length, 256); k++) {
              const vv = pcm[k] / 32768; energy += vv * vv;
            }
            const hasVoice = energy > 0.0005;
            if (hasVoice) { isSpeaking = true; if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; } }
            else if (isSpeaking && !silenceTimer) {
              silenceTimer = setTimeout(() => { isSpeaking = false; }, 500);
            }
            audioBuffer.push(pcm); totalLen += pcm.length;
            if (totalLen >= 32768) {
              const combined = new Int16Array(totalLen);
              let offset = 0;
              for (const chunk of audioBuffer) { combined.set(chunk, offset); offset += chunk.length; }
              audioBuffer = []; totalLen = 0;
              sendFrame(btoa(String.fromCharCode(...new Uint8Array(combined.buffer))), 1);
            }
          };
          sourceNode.connect(processorNode);
          sendFrame('', 0);
          frameInterval = setInterval(() => {
            if (!isRecording || !ws || ws.readyState !== 1) return;
            if (totalLen > 0) {
              const combined = new Int16Array(totalLen);
              let offset = 0;
              for (const chunk of audioBuffer) { combined.set(chunk, offset); offset += chunk.length; }
              audioBuffer = []; totalLen = 0;
              sendFrame(btoa(String.fromCharCode(...new Uint8Array(combined.buffer))), 1);
            }
          }, 500);
        })
        .catch(err => { showToast('麦克风错误: ' + err.message); stopRecording(); });
    };

    ws.onmessage = evt => {
      const data = JSON.parse(evt.data);
      if (data.code !== 0) { showToast('讯飞错误: ' + data.message); return; }
      const res = data.data;
      if (res && res.result) {
        const wsResult = res.result.ws || [];
        let text = '';
        for (const w of wsResult) text += w.cw[0].w;
        if (text) {
          document.getElementById('srcText').textContent = text;
          document.getElementById('srcText').classList.remove('placeholder');
          translateText(text).then(trans => {
            document.getElementById('dstText').textContent = trans;
            if (currentSession) {
              currentSession.segments.push({ time: new Date().toLocaleTimeString('zh-CN'), src: text, dst: trans, dir: cfg.dir, speaker: currentSpeaker });
              analyzeText(text);
            }
          });
        }
        if (res.status === 2) {
          sendFrame('', 2);
          if (frameInterval) { clearInterval(frameInterval); frameInterval = null; }
          if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
          setTimeout(() => { if (isRecording) startIflytek(); }, 500);
        }
      }
    };

    ws.onerror = () => { showToast('连接错误，重试中...'); };
    ws.onclose = () => { if (isRecording) setTimeout(() => startIflytek(), 800); };
  });
}

function sendFrame(audio, status) {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({
    common: { app_id: xconfig.appId },
    business: { language: cfg.dir === 'z2e' ? 'zh_cn' : 'en_us', domain: 'iat', accent: 'mandarin', vad_eos: 5000, dwa: 'wpgs' },
    data: { status, format: 'audio/L16;rate=16000', encoding: 'raw', audio }
  }));
}

function stopIflytek() {
  if (frameInterval) { clearInterval(frameInterval); frameInterval = null; }
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
  if (ws && ws.readyState === 1) { try { sendFrame('', 2); } catch(e) {} }
  if (ws) { ws.close(); ws = null; }
  if (processorNode) { processorNode.disconnect(); processorNode.onaudioprocess = null; processorNode = null; }
  if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (audioStream) { audioStream.getTracks().forEach(t => t.stop()); audioStream = null; }
  document.getElementById('statusText').textContent = '点击麦克风开始';
}

// ================= 浏览器原生语音识别 =================
let nativeRec = null;
function startNative() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('浏览器不支持语音识别'); return; }
  nativeRec = new SR();
  nativeRec.lang = cfg.dir === 'z2e' ? 'zh-CN' : 'en-US';
  nativeRec.continuous = true;
  nativeRec.interimResults = true;
  nativeRec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const text = e.results[i][0].transcript.trim();
        if (text) {
          document.getElementById('srcText').textContent = text;
          document.getElementById('srcText').classList.remove('placeholder');
          translateText(text).then(trans => {
            document.getElementById('dstText').textContent = trans;
            if (currentSession) {
              currentSession.segments.push({ time: new Date().toLocaleTimeString('zh-CN'), src: text, dst: trans, dir: cfg.dir, speaker: currentSpeaker });
              analyzeText(text);
            }
          });
        }
      }
    }
  };
  nativeRec.onerror = e => { if (e.error !== 'no-speech') showToast('识别错误: ' + e.error); };
  nativeRec.onend = () => { if (isRecording) setTimeout(() => startNative(), 200); };
  nativeRec.start();
}

function stopNative() {
  if (nativeRec) { try { nativeRec.stop(); } catch(e) {} nativeRec = null; }
}

// ================= 翻译 =================
function translateText(text) {
  const from = cfg.dir === 'z2e' ? 'zh' : 'en';
  const to = cfg.dir === 'z2e' ? 'en' : 'zh';
  return fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`)
    .then(r => r.json())
    .then(j => {
      if (j.responseStatus === 200) return j.responseData.translatedText;
      throw new Error(j.responseDetails || '翻译失败');
    })
    .catch(() => text);
}

// ================= 文本分析 =================
const SIGNALS = {
  '价格': ['价格', 'price', 'cost', 'cheap', 'expensive', 'discount', ' cheaper', 'costly'],
  '数量': ['数量', 'quantity', 'qty', 'how many', 'pieces', 'units', 'batch', 'order'],
  '交期': ['交期', 'delivery', 'lead time', 'when', 'ship', 'shipping', 'arrive'],
  '样品': ['样品', 'sample', '测试', 'test', '试用'],
  '质量': ['质量', 'quality', '认证', 'certificate', 'CE', 'FCC', 'ROHS'],
  '竞品': ['竞品', 'competitor', 'other brand', 'compare', '对比']
};

function analyzeText(text) {
  const lower = text.toLowerCase();
  for (const [signal, keywords] of Object.entries(SIGNALS)) {
    if (keywords.some(k => lower.includes(k)) && !insightTags.includes(signal)) {
      insightTags.push(signal);
    }
  }
  // Product matching
  for (const product of GXYKIT_PRODUCTS) {
    if (product.keywords.some(k => lower.includes(k.toLowerCase()))) {
      if (!matchedProducts.find(p => p.model === product.model)) {
        matchedProducts.push(product);
      }
    }
  }
  updateInsightUI();
}

function updateInsightUI() {
  const zone = document.getElementById('insightZone');
  const tagsEl = document.getElementById('insightTags');
  if (!insightTags.length && !matchedProducts.length) { zone.style.display = 'none'; return; }
  zone.style.display = 'block';
  let html = '';
  if (insightTags.length) {
    html += insightTags.map(t => `<span class="tag hot">${t}</span>`).join('');
  }
  if (matchedProducts.length) {
    html += matchedProducts.slice(0, 3).map(p => `<span class="tag product">${p.model}</span>`).join('');
  }
  tagsEl.innerHTML = html;
}

function generateInsight() {
  if (!currentSession || !currentSession.segments.length) return;
  const signals = [...new Set(insightTags)];
  const products = matchedProducts.slice(0, 3);
  currentSession.signals = signals;
  currentSession.products = products;
  updateInsightUI();
}

// ================= 保存 =================
function saveConversation() {
  if (!currentSession || !currentSession.segments.length) { showToast('没有可保存的内容'); return; }
  currentSession.endTime = new Date().toISOString();
  const conversations = DB.getConversations();
  conversations.unshift(currentSession);
  DB.saveConversations(conversations);
  showToast('已保存到客户档案');
  document.getElementById('saveZone').style.display = 'none';
  // Reset
  currentSession = null;
  insightTags = []; matchedProducts = [];
  document.getElementById('srcText').textContent = '等待语音输入...';
  document.getElementById('srcText').classList.add('placeholder');
  document.getElementById('dstText').textContent = '';
  document.getElementById('insightZone').style.display = 'none';
}

function saveCurrentSession() {
  if (!currentSession || !currentSession.segments.length) return;
  if (!currentCustomer) { showToast('未选择客户，无法保存'); return; }
  currentSession.endTime = new Date().toISOString();
  currentSession.customerId = currentCustomer.id;
  const conversations = DB.getConversations();
  conversations.unshift(currentSession);
  DB.saveConversations(conversations);
  showToast('已保存到 ' + currentCustomer.name + ' 的档案');
  document.getElementById('saveZone').style.display = 'none';
  currentSession = null;
  insightTags = []; matchedProducts = [];
  document.getElementById('srcText').textContent = '等待语音输入...';
  document.getElementById('srcText').classList.add('placeholder');
  document.getElementById('dstText').textContent = '';
  document.getElementById('insightZone').style.display = 'none';
}

function showSettings() {
  document.getElementById('settingsMask').classList.add('show');
  document.getElementById('settingsSheet').classList.add('show');
}

function hideSettings() {
  document.getElementById('settingsMask').classList.remove('show');
  document.getElementById('settingsSheet').classList.remove('show');
}

function saveSettings() {
  cfg.engine = document.getElementById('engineSel').value;
  cfg.llmKey = document.getElementById('llmKey').value.trim();
  DB.saveSettings(cfg);
  hideSettings();
  showToast('设置已保存');
}

  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

  updateDirUI();
  DB.saveSettings(cfg);
}

document.getElementById('dirZ2E').onclick = () => switchDir('z2e');
document.getElementById('dirE2Z').onclick = () => switchDir('e2z');

init();
